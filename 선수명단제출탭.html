<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배곧해솔중 배드민턴 대회 - 학급별 선수 명단 제출</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Jua', sans-serif; user-select: none; }
        body { background-color: #f4f7f6; color: #333; min-height: 100vh; padding: 30px 15px; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 2.1rem; color: #0077b6; margin-bottom: 5px; }
        header p { font-size: 1.05rem; color: #555; }

        .qr-form-container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            border: 2px solid #0077b6; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.06); 
        }

        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-size: 1.15rem; margin-bottom: 8px; color: #0077b6; font-weight: bold; }
        .form-group select { 
            width: 100%; 
            padding: 12px; 
            font-size: 1.1rem; 
            border-radius: 10px; 
            border: 2px solid #ced4da; 
            background: #f8f9fa; 
            color: #333; 
            outline: none;
            transition: 0.2s;
        }
        .form-group select:focus { border-color: #0077b6; }
        
        .roster-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 25px; }
        .roster-item { background: #f8f9fa; padding: 14px; border-radius: 12px; border: 1px solid #dee2e6; }
        
        /* 💡 종목별 맞춤 컬러 설정 */
        .roster-item.male label { font-size: 1rem; color: #2b9348; margin-bottom: 6px; display: block; font-weight: bold; } /* 남자복식: 초록색 */
        .roster-item.female label { font-size: 1rem; color: #f77f00; margin-bottom: 6px; display: block; font-weight: bold; } /* 여자복식: 주황색 */
        .roster-item.mixed label { font-size: 1rem; color: #ff007f; margin-bottom: 6px; display: block; font-weight: bold; } /* 혼합복식: 핑크색 */
        .roster-item.sub label { font-size: 1rem; color: #4361ee; margin-bottom: 6px; display: block; font-weight: bold; } /* 후보선수: 파란색 */

        .roster-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .roster-inputs input { 
            width: 100%; 
            padding: 10px; 
            font-size: 1rem; 
            border-radius: 8px; 
            border: 1px solid #ced4da; 
            background: #ffffff; 
            color: #333; 
            outline: none;
            transition: 0.2s;
        }
        .roster-inputs input:focus { border-color: #0077b6; box-shadow: 0 0 5px rgba(0,119,182,0.2); }

        .submit-btn { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.15rem; 
            background: #2b9348; 
            color: #fff; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(43,147,72,0.25);
            transition: 0.2s; 
        }
        .submit-btn:hover { background: #237a3c; }

        #complete-screen { display: none; text-align: center; padding: 40px 20px; }
        #complete-screen h2 { color: #2b9348; font-size: 1.8rem; margin-bottom: 15px; }
        #complete-screen p { color: #555; font-size: 1.1rem; margin-bottom: 25px; line-height: 1.5; }
    </style>
</head>
<body>

    <header>
        <h1>📝 학급별 선수 명단 제출</h1>
        <p>우리 반의 종목별 출전 선수 및 후보를 정확히 입력하고 제출해주세요!</p>
    </header>

    <div class="qr-form-container">
        <!-- 입력 폼 영역 -->
        <div id="form-screen">
            <div class="form-group">
                <label>우리 반 선택</label>
                <select id="select-class" onchange="onClassSelectChange()">
                    <option value="">-- 학급을 선택하세요 (1반~14반) --</option>
                </select>
            </div>
            
            <div class="roster-grid">
                <div class="roster-item male"><label>남자복식 1</label><div class="roster-inputs"><input type="text" id="r-m1-0" placeholder="선수 1"><input type="text" id="r-m1-1" placeholder="선수 2"></div></div>
                <div class="roster-item male"><label>남자복식 2</label><div class="roster-inputs"><input type="text" id="r-m2-0" placeholder="선수 1"><input type="text" id="r-m2-1" placeholder="선수 2"></div></div>
                <div class="roster-item male"><label>남자복식 3</label><div class="roster-inputs"><input type="text" id="r-m3-0" placeholder="선수 1"><input type="text" id="r-m3-1" placeholder="선수 2"></div></div>
                <div class="roster-item female"><label>여자복식 1</label><div class="roster-inputs"><input type="text" id="r-f1-0" placeholder="선수 1"><input type="text" id="r-f1-1" placeholder="선수 2"></div></div>
                <div class="roster-item female"><label>여자복식 2</label><div class="roster-inputs"><input type="text" id="r-f2-0" placeholder="선수 1"><input type="text" id="r-f2-1" placeholder="선수 2"></div></div>
                <div class="roster-item female"><label>여자복식 3</label><div class="roster-inputs"><input type="text" id="r-f3-0" placeholder="선수 1"><input type="text" id="r-f3-1" placeholder="선수 2"></div></div>
                <div class="roster-item mixed"><label>혼합복식</label><div class="roster-inputs"><input type="text" id="r-mixed-0" placeholder="선수 1 (남)"><input type="text" id="r-mixed-1" placeholder="선수 2 (여)"></div></div>
                <div class="roster-item sub"><label>후보 선수</label><div class="roster-inputs"><input type="text" id="r-subM-0" placeholder="남학생 후보"><input type="text" id="r-subF-0" placeholder="여학생 후보"></div></div>
            </div>

            <button class="submit-btn" onclick="submitRosterNew()">우리반 선수 명단 제출하기</button>
        </div>

        <!-- 제출 완료 화면 영역 -->
        <div id="complete-screen">
            <h2 id="complete-title">🎉 배드민턴 선수 명단 제출 완료</h2>
            <p>우리 반의 선수 명단이 성공적으로 등록되었습니다.<br>내용을 수정하려면 아래 버튼을 눌러주세요.</p>
            <button class="submit-btn" style="background: #0077b6;" onclick="backToEdit()">다시 수정하기</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'badminton_team_permanent_v34';
        let appData = { matchups: {}, rosters: {}, seeds: [], selectedMatchupId: 1 };

        const selectClassEl = document.getElementById('select-class');
        for (let i = 1; i <= 14; i++) {
            let opt = document.createElement('option');
            opt.value = `2학년 ${i}반`;
            opt.textContent = `2학년 ${i}반`;
            selectClassEl.appendChild(opt);
        }

        function loadPermanentData() {
            let localData = localStorage.getItem(STORAGE_KEY);
            if (localData) {
                try {
                    let parsed = JSON.parse(localData);
                    if (parsed) appData = parsed;
                    if (!appData.rosters) appData.rosters = {};
                } catch(e) {}
            }
        }

        window.onClassSelectChange = function() {
            loadPermanentData();
            let className = selectClassEl.value;
            const keys = ["m1", "m2", "m3", "f1", "f2", "f3", "mixed", "subM", "subF"];
            
            keys.forEach(k => {
                let i0 = document.getElementById(`r-${k}-0`);
                let i1 = document.getElementById(`r-${k}-1`);
                if (i0) i0.value = '';
                if (i1) i1.value = '';
            });

            if (!className) return;
            
            if (appData.rosters && appData.rosters[className]) {
                let classData = appData.rosters[className];
                keys.forEach(k => {
                    if (classData[k]) {
                        let i0 = document.getElementById(`r-${k}-0`);
                        let i1 = document.getElementById(`r-${k}-1`);
                        if (i0) i0.value = classData[k][0] || '';
                        if (i1) i1.value = classData[k][1] || '';
                    }
                });
            }
        }

        window.submitRosterNew = function() {
            loadPermanentData();
            let className = selectClassEl.value;
            if (!className) {
                alert("반을 먼저 선택해주세요!");
                return;
            }

            const keys = ["m1", "m2", "m3", "f1", "f2", "f3", "mixed", "subM", "subF"];
            if (!appData.rosters) appData.rosters = {};
            if (!appData.rosters[className]) appData.rosters[className] = {};

            keys.forEach(k => {
                let input0 = document.getElementById(`r-${k}-0`);
                let input1 = document.getElementById(`r-${k}-1`);
                let val0 = input0 ? input0.value.trim() : '';
                let val1 = input1 ? input1.value.trim() : '';
                appData.rosters[className][k] = [val0, val1];
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            
            document.getElementById('complete-title').textContent = `🎉 [${className}] 배드민턴 선수 명단 제출 완료`;
            document.getElementById('form-screen').style.display = 'none';
            document.getElementById('complete-screen').style.display = 'block';
        }

        window.backToEdit = function() {
            document.getElementById('form-screen').style.display = 'block';
            document.getElementById('complete-screen').style.display = 'none';
        }

        loadPermanentData();
    </script>
</body>
</html>
